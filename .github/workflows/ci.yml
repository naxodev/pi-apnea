name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun x tsc --noEmit

      # The floating-dispatch smoke test self-skips without HERDR_ENV=1; the
      # rest of the suite needs no herdr, no network, and no git identity
      # (start-wait.smoke.test.ts configures its own temp repo).
      - name: Test
        run: bun test extension
